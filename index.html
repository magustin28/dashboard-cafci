<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard CAFCI</title>
    <!-- PWA: el manifest y los iconos viven en public/ (los PNG los genera scripts/generar-iconos.ps1).
         Las rutas de abajo arrancan con el placeholder de base de Vite, así funcionan igual en dev y en
         GitHub Pages sin hardcodear el subpath del repo. -->
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <link rel="apple-touch-icon" href="%BASE_URL%icons/apple-touch-icon.png" />
    <!-- theme-color: el --bg de base.css, para que la barra del navegador combine con el header. -->
    <meta name="theme-color" content="#f0f0ee" />
    <!-- iOS no lee el manifest para esto: necesita sus propios meta y el apple-touch-icon de arriba. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="FCI - Argentina" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
