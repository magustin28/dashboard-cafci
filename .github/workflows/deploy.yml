name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validar y buildear (npm run check)
        # npm run check corre lint, prettier --check, node --test y el build completo (vite build +
        # precache de la PWA). Así un push con lint, formato o tests rotos no llega a publicar.
        # Reemplaza al paso "Build" suelto, que hacía el mismo build por duplicado.
        run: npm run check

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  # El deploy va en un job aparte a propósito: si comparte job con el upload, deploy-pages puede
  # consultar la API de artifacts antes de que el artifact quede indexado y falla con "No artifacts
  # named github-pages were found" aunque el upload haya terminado bien (issue conocido de
  # actions/deploy-pages). Con jobs separados el deploy corre en un runner nuevo y ya lo encuentra.
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
